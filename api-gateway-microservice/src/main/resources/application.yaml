server:
  port: 8080

grpc:
  client:
    extraction_results:
      address: dns:///results:9090
      negotiationType: plaintext
    users_info:
      address: dns:///users:9091
      negotiationType: plaintext
    parsing_orchestrator:
      address: dns:///orchestrator:9092
      negotiationType: plaintext

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration_min: ${JWT_EXPIRATION_MIN:60}

s3:
  access_key: ${S3_ACCESS_KEY}
  secret_key: ${S3_SECRET_KEY}
  endpoint_url: ${S3_ENDPOINT_URL:http://garage:3900}
  path_style_access: ${S3_PATH_STYLE_ACCESS:true}
  region_name: ${S3_REGION_NAME:garage}
  bucket_name: ${S3_CUSTOM_TTL_BUCKET_NAME}
