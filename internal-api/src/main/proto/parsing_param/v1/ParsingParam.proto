syntax = "proto3";
package parsing_param.v1;  // namespace для .proto файла

option java_package = "io.github.maksim0840.parsing_param.v1";  // package для генерации .java классов из .proto файла
option java_multiple_files = true;  // для удобной генерации и обращения (каждый message/service генерируется в отдельный .java файл)

import "google/protobuf/timestamp.proto";   // timestamp


// ===== Модель =====

message HtmlParserParamsProto {
  optional bool download_images = 1;
  map<string, string> headers = 2;
  map<string, string> cookies = 3;
  map<string, string> proxy = 4;
  optional string page_complexity = 5;
  optional int32 additional_page_load_timeout_s = 6;
}

message HtmlPreprocessingParamsProto {
  optional bool noscript_processing = 1;
  optional bool link_processing = 2;
  optional bool style_processing = 3;
  optional bool meta_processing = 4;
  optional bool script_processing = 5;
  optional bool canvas_processing = 6;
  optional bool svg_processing = 7;
  optional bool area_processing = 8;
  optional bool img_processing = 9;
  optional bool video_processing = 10;
  optional bool audio_processing = 11;
  optional bool iframe_processing= 12;
  optional bool portal_processing = 13;
  optional bool embed_processing = 14;
  optional bool object_processing = 15;
  optional bool source_processing = 16;
}

message LLMParamsProto {
  string model_name = 1;
  string system_message = 2;
  string user_message = 3;
  optional double temperature = 4;
  optional int32 max_output_tokens = 5;
}

message ParsingParamProto {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  HtmlParserParamsProto html_parser_params = 5;
  HtmlPreprocessingParamsProto html_preprocessing_params = 6;
  LLMParamsProto llm_params = 7;
}


// ===== Запросы сервису users-info (ParsingParam domain) =====

// Запрос на создание записи по параметрам
message CreateParsingParamRequest {
  int64 user_id = 1;
  string name = 2;
  HtmlParserParamsProto html_parser_params = 3;
  HtmlPreprocessingParamsProto html_preprocessing_params = 4;
  LLMParamsProto llm_params = 5;
}

// Запрос на редактирование записи по параметрам
message EditParsingParamRequest {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  HtmlParserParamsProto html_parser_params = 4;
  HtmlPreprocessingParamsProto html_preprocessing_params = 5;
  LLMParamsProto llm_params = 6;
}

// Запросы на получение записи по id
message GetParsingParamRequest {
  int64 id = 1;
}

// Запрос на получение списка записей по фильтрам
message GetListParsingParamRequest {
  optional int64 user_id = 1;
  optional google.protobuf.Timestamp created_from = 2;
  optional google.protobuf.Timestamp created_to = 3;
  int32 page_num = 4;
  int32 page_size = 5;
  optional bool sort_created_desc = 6;
}

// Удалить запись по id
message DeleteParsingParamRequest {
  int64 id = 1;
}

// Запрос на получение списка имён параметров по id пользователя
message GetNamesParsingParamRequest {
  int64 user_id = 1;
}

// Запрос на получение записи по id пользователя и имени параметра
message GetParsingParamByUserIdAndNameRequest {
  int64 user_id = 1;
  string name = 2;
}

// Переменовать параметр по id пользователю и старому имени параметра
message RenameParsingParamByUserIdAndNameRequest {
  int64 user_id = 1;
  string old_name = 2;
  string new_name = 3;
}

// Удалить запись по id пользователю и имени параметра
message DeleteParsingParamByUserIdAndNameRequest {
  int64 user_id = 1;
  string name = 2;
}


// ===== Ответы от сервиса users-info (ParsingParam domain) =====

message CreateParsingParamResponse {
  ParsingParamProto parsing_param = 1;
}

message EditParsingParamResponse {
  ParsingParamProto parsing_param = 1;
}

message GetParsingParamResponse {
  ParsingParamProto parsing_param = 1;
}

message GetListParsingParamResponse {
  repeated ParsingParamProto parsing_params = 1;
}

message DeleteParsingParamResponse {
}

message GetNamesParsingParamResponse {
  repeated string names = 1;
}

message GetParsingParamByUserIdAndNameResponse {
  ParsingParamProto parsing_param = 1;
}

message RenameParsingParamByUserIdAndNameResponse {
}

message DeleteParsingParamByUserIdAndNameResponse {
}


// ===== Сервис (gRPC api) =====

service ParsingParamService {
  rpc Create(CreateParsingParamRequest) returns (CreateParsingParamResponse);
  rpc Edit(EditParsingParamRequest) returns (EditParsingParamResponse);
  rpc Get(GetParsingParamRequest) returns (GetParsingParamResponse);
  rpc GetList(GetListParsingParamRequest) returns (GetListParsingParamResponse);
  rpc Delete(DeleteParsingParamRequest) returns (DeleteParsingParamResponse);
  rpc GetNamesByUserId(GetNamesParsingParamRequest) returns (GetNamesParsingParamResponse);
  rpc GetByUserIdAndName(GetParsingParamByUserIdAndNameRequest) returns (GetParsingParamByUserIdAndNameResponse);
  rpc RenameByUserIdAndName(RenameParsingParamByUserIdAndNameRequest) returns (RenameParsingParamByUserIdAndNameResponse);
  rpc DeleteByUserIdAndName(DeleteParsingParamByUserIdAndNameRequest) returns (DeleteParsingParamByUserIdAndNameResponse);
}