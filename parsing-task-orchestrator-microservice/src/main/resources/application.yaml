spring:
  application:
    name: parsing-orchestrator

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin123
    virtual-host: /

  data:
    mongodb:
      uri: mongodb://mongodb_orchestrator:27017/tasks

server:
  port: 8080

grpc:
  server:
    port: 9092 # parsing_orchestrator

rabbitmq:
  html_parser_queue:
    request_name: html_parser_queue_request
    response_name: html_parser_queue_response

  html_preprocessing_queue:
    request_name: html_preprocessing_queue_request
    response_name: html_preprocessing_queue_response

  text_recognition_queue:
    request_name: text_recognition_queue_request
    response_name: text_recognition_queue_response

llm:
  yandexgpt_model_api_name: ${YANDEXGPT_MODEL_API_NAME}
  yandexgpt_model_view_name: ${YANDEXGPT_MODEL_VIEW_NAME}
  yandexgpt_api_key: ${YANDEXGPT_API_KEY}
  yandexgpt_folder_id: ${YANDEXGPT_FOLDER_ID}
  yandexgpt_base_url: ${YANDEXGPT_BASE_URL:https://ai.api.cloud.yandex.net/v1}

  gigachat_model_api_name: ${GIGACHAT_MODEL_API_NAME}
  gigachat_model_view_name: ${GIGACHAT_MODEL_VIEW_NAME}
  gigachat_auth_key: ${GIGACHAT_AUTH_KEY}

  default_temperature: ${DEFAULT_TEMPERATURE:0.2}
  default_max_output_tokens: ${DEFAULT_MAX_OUTPUT_TOKENS:2500}
  connection_timeout_s: ${CONNECTION_TIMEOUT_S:15}
  response_timeout_s: ${RESPONSE_TIMEOUT_S:120}

s3:
  access_key: ${S3_ACCESS_KEY)
  secret_key: ${S3_SECRET_KEY}
  endpoint_url: ${S3_ENDPOINT_URL:http://garage:3900}
  path_style_access: ${S3_PATH_STYLE_ACCESS:true}
  region_name: ${S3_REGION_NAME:garage}
  bucket_name: ${S3_CUSTOM_TTL_BUCKET_NAME}