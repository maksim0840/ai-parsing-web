
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    ports:
      - "5673:5672"     # AMQP
      - "15673:15672"   # Web UI

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    
    networks:
      - rabbitmq-net
      
volumes:
  rabbitmq_data:
  
networks:
  rabbitmq-net:
    external: true
    name: rabbitmq-net
